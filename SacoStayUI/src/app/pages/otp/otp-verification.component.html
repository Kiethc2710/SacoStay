<div class="min-h-screen bg-gray-50 flex flex-col">
  <!-- Navbar - TODO: Create navbar component -->
  <nav class="bg-white shadow-sm border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <h1 class="text-2xl font-bold text-saco-orange">SacoStay</h1>
        </div>
        <div class="flex items-center space-x-4">
          <a routerLink="/login" class="text-gray-700 hover:text-saco-orange px-3 py-2 rounded-md text-sm font-medium">
            Đăng nhập
          </a>
          <a routerLink="/register" class="bg-saco-orange text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-saco-orange-dark">
            Đăng ký
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md p-8 text-center bg-white rounded-2xl shadow-lg border border-orange-50">
      <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-6">
        <svg class="w-8 h-8 text-custom-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
      </div>

      <h1 class="text-2xl font-bold text-custom-dark mb-2">
        Xác thực Email
      </h1>
      <p class="text-custom-gray mb-8">
        Chúng tôi đã gửi mã xác thực gồm 6 chữ số đến email
        <br />
        <span class="font-semibold text-custom-dark">{{ email }}</span>
      </p>

      <div class="flex justify-center gap-2 mb-8">
        <div *ngFor="let digit of otp; let i = index" class="otp-input-container">
          <input
            [id]="'otp-' + i"
            type="text"
            inputMode="numeric"
            [(ngModel)]="otp[i]"
            (ngModelChange)="handleChange(i, $event)"
            (keydown)="handleKeyDown(i, $event)"
            class="w-12 h-14 text-center text-2xl font-bold rounded-xl border border-gray-300 focus-border-orange focus-ring-2 focus-ring-orange outline-none transition-all"
            maxlength="1"
          />
        </div>
      </div>

      <button
        class="w-full mb-6 bg-saco-orange text-white px-6 py-3 rounded-lg font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        (click)="handleVerify()"
        [disabled]="!isOtpComplete || isLoading"
      >
        <span *ngIf="!isLoading">Xác thực</span>
        <span *ngIf="isLoading" class="flex items-center justify-center">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Đang xử lý...
        </span>
      </button>

      <div class="text-sm text-custom-gray">
        Chưa nhận được mã?{' '}
        <span *ngIf="countdown > 0" class="font-medium text-custom-dark">
          Gửi lại sau {{ countdown }}s
        </span>
        <button
          *ngIf="canResend"
          (click)="handleResend()"
          class="font-medium text-custom-orange hover-underline"
        >
          Gửi lại mã
        </button>
      </div>
    </div>
  </div>
</div>
